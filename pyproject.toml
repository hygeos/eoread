[project]
name = "eoread"
authors = [{name = "HYGEOS team"}]
description = "Modular implementation of satellite data input/output relying on xarray."
license = "Apache 2.0"
version = "2.0.0"
requires-python = ">= 3.10, < 3.14"
readme = "README.md"
dependencies = [
    # v2 runtime (eoread/readers + eoread/transforms):
    "xarray", "dask", "numpy",
    "rioxarray", "rasterio",        # MSI / OLI raster inputs
    "h5netcdf", "h5py", "netcdf4",  # xarray engines (HDF5 / NetCDF inputs)
    "pyhdf",                        # MODIS HDF4 fallback backend (eoread/hdf4.py)
    "pyproj",                       # UTM -> geographic transforms
    # auxiliary runtime used by individual v2 readers:
    "pandas",            # GEOSAT / PlanetScope / Pleiades(-Neo) metadata
    "scipy",             # GEOSAT geolocation
    "python-dateutil",   # GOES-NG / HYPSO / PACE / SGLI time parsing
    "pysolar",           # GOES-NG sun position
    "pyepr",             # MERIS (imports as `epr`)
]

[project.optional-dependencies]
git = [
    "core @ git+https://github.com/hygeos/core.git",
]
samples = [
    # optional: enables Reader.get_sample() downloads (lazy import in tools.py)
    "sand @ git+https://github.com/hygeos/SAND.git",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
eoread = { path = ".", editable = true, extras = ["git"]}
sand = { git = "git+https://github.com/hygeos/SAND.git" }

[tool.pixi.tasks]
# No-data gate: every module must import and the test suite must collect,
# without any sample product available.
gate = "python3 scripts/import_smoke.py && pytest tests/ --collect-only -q"
tests = "pytest tests/"
docs-build = "quartodoc build --config docs/_quarto.yml"
docs-render = { cmd = "quarto render docs/", depends-on = ["docs-build"] }
docs-preview = { cmd = "quarto preview docs/", depends-on = ["docs-build"] }

[tool.pixi.dependencies]
pytest = "*"
pytest-html = "*"
pytest-xdist = "*"
matplotlib-base = "*"
ipykernel = "*"
libgdal-jp2openjpeg = "*"  # Required to read compress jp2 file in MSI reader
pyhdf = "*"
numba = "*"
quartodoc = "*"
nbformat = "*"
nbclient = "*"
jupyter-cache = "*"
griffe = ">=1.0,<2.0"

[tool.pixi.environments]
default = { features = ["hyp", "sys"], solve-group = "default" }

[tool.pixi.feature.sys.dependencies]
libgdal-jp2openjpeg = "*"

[tool.pixi.feature.hyp.dependencies]
xarray = "*"
dask = "*"
scipy = "*"
numpy = "*"

