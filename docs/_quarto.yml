project:
  type: website
  preview:
    port: 8000
    browser: false

# tell quarto to read the generated sidebar and styles
metadata-files:
  - reference/_sidebar.yml

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - _extensions/hygeos-docs/css/hygeos-docs.css
    toc: true

execute:
  echo: false
  cache: true
  warning: false


website:
  title: "eoread"
  site-url: "https://hygeos.github.io/Eoread/"
  repo-url: "https://github.com/hygeos/Eoread"
  repo-actions: [issue]
  page-navigation: true
  open-graph: true
  search:
    location: navbar
    type: overlay
  navbar:
    background: primary
    search: true
    logo: _extensions/hygeos-docs/logo-carre-blanc.png
    logo-alt: "HYGEOS"
    left:
      - text: "Home"
        file: index.qmd
      - text: "Reference"
        href: reference/
      - text: "Guides"
        menu:
          - text: "Getting Started"
            file: articles/getting-started.qmd
    right:
      - icon: github
        href: "https://github.com/hygeos/Eoread"
        aria-label: "GitHub Repository"
  page-footer:
    center: |
      Powered by [HYGEOS](https://www.hygeos.com) | eoread &copy; 2026 | version 2.0.0
  sidebar:
    - title: "Overview"
      contents:
        - index.qmd
    - title: "Guides"
      contents:
        - articles/getting-started.qmd


quartodoc:
  package: eoread
  dir: reference
  title: API Reference

  # write sidebar and style data
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css
  
  sections:
    - title: Readers
      desc: v2 readers, one module per sensor, emitting the canonical schema
      contents:
        - readers.ecostress
        - readers.geosat
        - readers.goesng
        - readers.hico
        - readers.hypso
        - readers.meris
        - readers.modis
        - readers.msi
        - readers.olci
        - readers.oli
        - readers.pace
        - readers.planetscope
        - readers.pleiades
        - readers.pleiades_neo
        - readers.prisma
        - readers.sgli
        - readers.venus

    - title: Core
      desc: Reader base class, canonical schema validation and sample registry
      contents:
        - reader.Reader
        - reader.discover_readers
        - schema.validate
        - samples

    - title: Flags
      desc: Quality flag management interface for satellite products
      contents:
        - flags.GenericFlags
        - flags.FlagsInit
        - flags.FlagsReaderBase

    - title: Tools
      desc: Shared utilities for raster I/O, resampling, metadata filtering, and chunking
      contents:
        - tools.open_raster
        - tools.spatial_resample
        - tools.filter_metadata
        - tools.format_chunks
        - tools.collect_sample


